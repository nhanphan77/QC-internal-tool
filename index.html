<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <title>Report Devtool | Premium</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --bg-body: #F8FAFC;
      --bg-card: #FFFFFF;
      --primary: #4F46E5;
      --primary-hover: #4338CA;
      --primary-light: #EEF2FF;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --border: #E2E8F0;
      --border-focus: #6366F1;
      --danger: #EF4444;
      --danger-bg: #FEF2F2;
      --success: #10B981;
      --success-bg: #ECFDF5;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-body);
      color: var(--text-main);
      padding-bottom: 120px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .navbar {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 14px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .brand {
      font-size: 20px;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: -0.02em;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      background: var(--primary);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }

    .brand span {
      color: var(--primary);
    }

    .jira-badge {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-body);
      padding: 6px 14px;
      border-radius: 99px;
      border: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
    }

    .jira-status-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--text-muted);
      display: inline-block;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 20px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid transparent;
      font-family: inherit;
      gap: 8px;
    }

    .btn-sm {
      padding: 6px 14px;
      font-size: 13px;
      border-radius: var(--radius-sm);
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(79, 70, 229, 0.25);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
    }

    .btn-secondary {
      background: #FFFFFF;
      border-color: var(--border);
      color: var(--text-main);
      box-shadow: var(--shadow-sm);
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--bg-body);
      border-color: #CBD5E1;
      color: var(--primary);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    .btn-text {
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      border: none;
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      transition: all 0.15s ease;
    }

    .btn-text:hover {
      color: var(--primary);
      background: var(--primary-light);
    }

    .container {
      max-width: 1400px;
      margin: 28px auto;
      padding: 0 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: 100%;
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      box-shadow: var(--shadow-md);
      border-color: #CBD5E1;
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      letter-spacing: -0.01em;
    }

    .form-row-single {
      display: flex;
      gap: 16px;
      width: 100%;
      flex-wrap: wrap;
      align-items: flex-start;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1 1 200px;
      min-width: 0;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
    }

    .required {
      color: var(--danger);
      margin-left: 2px;
    }

    .helper {
      font-size: 11px;
      font-weight: 400;
      color: var(--text-muted);
    }

    input[type="text"],
    input[type="date"] {
      width: 100%;
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: #FFFFFF;
      font-family: inherit;
      font-size: 13px;
      color: var(--text-main);
      transition: all 0.15s ease;
    }

    input[type="text"]:focus,
    input[type="date"]:focus {
      outline: none;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    input::placeholder {
      color: #94A3B8;
    }

    .pill-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .pill-checkbox {
      display: none;
    }

    .pill-label {
      padding: 6px 12px;
      background: var(--bg-body);
      color: var(--text-muted);
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid var(--border);
      user-select: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .pill-checkbox:checked+.pill-label {
      background: var(--primary-light);
      color: var(--primary);
      border-color: var(--primary);
      font-weight: 700;
    }

    .pill-label:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .btn-delete-scope {
      background: transparent;
      border: none;
      color: var(--danger);
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      margin-left: 2px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 3px;
      border-radius: 3px;
    }

    .btn-delete-scope:hover {
      background: var(--danger-bg);
    }

    .accordion {
      background: var(--bg-body);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .accordion summary {
      padding: 12px 14px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .accordion summary::-webkit-details-marker {
      display: none;
    }

    .accordion summary::after {
      content: "↓";
      font-size: 12px;
      color: var(--text-muted);
      transition: transform 0.2s;
    }

    .accordion[open] summary::after {
      transform: rotate(180deg);
    }

    .accordion[open] summary {
      border-bottom: 1px solid var(--border);
      background: #FFFFFF;
    }

    .accordion-content {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: #FFFFFF;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .status-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .action-dock {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 10px 20px;
      border-radius: 99px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 100;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .action-dock .btn-primary {
      background: #6366F1;
    }

    .action-dock .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.15);
      color: #FFFFFF;
    }

    .action-dock .btn-secondary:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.2);
      color: #FFFFFF;
    }

    #notes-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }

    .note-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(6px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .modal.active {
      display: flex;
      opacity: 1;
    }

    .modal-box {
      background: var(--bg-card);
      width: 860px;
      max-width: 92vw;
      height: 80vh;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: translateY(12px);
      transition: transform 0.25s ease;
    }

    .modal.active .modal-box {
      transform: translateY(0);
    }

    .modal-head {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-head h2 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
    }

    .modal-body {
      flex: 1;
      padding: 20px 24px;
      min-height: 0;
      display: flex;
      background: var(--bg-body);
    }

    textarea#preview-output {
      flex: 1;
      width: 100%;
      resize: none;
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.6;
      padding: 18px;
      background: #0F172A;
      color: #F8FAFC;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      outline: none;
    }

    .modal-foot {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      background: #FFFFFF;
    }

    .toast-box {
      position: fixed;
      bottom: 96px;
      right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toast {
      padding: 12px 18px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: var(--shadow-lg);
      animation: slideIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      color: #FFFFFF;
    }

    .toast.error {
      background: var(--danger);
    }

    .toast.success {
      background: var(--success);
    }

    .toast.loading {
      background: var(--primary);
    }

    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }

      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    @media (max-width: 900px) {
      .container {
        padding: 0 16px;
        margin: 16px auto;
      }

      .form-row-single {
        flex-direction: column;
      }

      .action-dock {
        width: calc(100% - 32px);
        justify-content: space-between;
      }

      .action-dock .btn {
        flex: 1;
        padding: 10px;
        font-size: 13px;
      }

      .navbar {
        padding: 12px 16px;
      }

      .jira-badge span {
        display: none;
      }
    }
  </style>
</head>

<body>

  <nav class="navbar">
    <div class="brand">
      <div class="brand-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z" />
          <polyline points="14 2 14 8 20 8" />
        </svg>
      </div>
      Report<span>Devtool</span>
    </div>
    <div class="jira-badge">
      <span class="jira-status-indicator" id="jira-status-dot"></span>
      <span id="jira-status-text">Jira: Not Connected</span>
      <button id="btn-jira-login" class="btn btn-sm btn-primary">Connect SSO</button>
    </div>
  </nav>

  <main class="container">

    <!-- Block 1: Project Information -->
    <section class="card">
      <div class="card-title">
        1. Project Information
      </div>

      <div class="form-row-single">
        <div class="form-group">
          <label>Project Key <span class="required">*</span></label>
          <div style="display: flex; gap: 8px;">
            <input type="text" id="sheet-name" placeholder="e.g., 9707" autocomplete="off">
            <button id="btn-load-statuses" type="button" class="btn btn-secondary" style="padding: 0 12px;"
              title="Sync Jira Statuses">↻</button>
          </div>
        </div>
        <div class="form-group">
          <label>Sheet Tab Name</label>
          <input type="text" id="sheet-tab-name" placeholder="Optional..." autocomplete="off">
          <span class="helper">Defaults to Project Key</span>
        </div>
        <div class="form-group">
          <label>Report Date</label>
          <input type="date" id="date-report">
        </div>
        <div class="form-group">
          <label>QC Team <span class="required">*</span></label>
          <input type="text" id="qc-names" placeholder="Victor, Anna..." autocomplete="off">
        </div>
      </div>

      <details class="accordion">
        <summary>Advanced Jira Status Mapping</summary>
        <div class="accordion-content">
          <div>
            <div class="status-row">
              <span class="status-title">1. Show in Section B</span>
              <div>
                <button type="button" id="btn-all-b" class="btn-text">Select All</button>
                <button type="button" id="btn-none-b" class="btn-text">Clear</button>
              </div>
            </div>
            <div id="status-b-container" class="pill-group"><span class="helper">Click ↻ to fetch...</span></div>
          </div>
          <div>
            <div class="status-row">
              <span class="status-title">2. Count as Unverified</span>
              <div>
                <button type="button" id="btn-all-unverified" class="btn-text">Select All</button>
                <button type="button" id="btn-none-unverified" class="btn-text">Clear</button>
              </div>
            </div>
            <div id="status-unverified-container" class="pill-group"><span class="helper">Click ↻ to fetch...</span>
            </div>
          </div>
          <div>
            <div class="status-row">
              <span class="status-title">3. Count as Pending</span>
              <div>
                <button type="button" id="btn-all-pending" class="btn-text">Select All</button>
                <button type="button" id="btn-none-pending" class="btn-text">Clear</button>
              </div>
            </div>
            <div id="status-pending-container" class="pill-group"><span class="helper">Click ↻ to fetch...</span></div>
          </div>
        </div>
      </details>
    </section>

    <!-- Block 2: Environment & Links (Đã sắp xếp cân đối gọn gàng) -->
    <section class="card">
      <div class="card-title">2. Environment & Links</div>

      <!-- Hàng 1: Game & App Version Info -->
      <div class="form-row-single">
        <div class="form-group">
          <label>Game Version <span class="required">*</span></label>
          <input type="text" id="version-game" placeholder="1.0.0" autocomplete="off">
        </div>
        <div class="form-group">
          <label>Version Date</label>
          <input type="date" id="date-game">
        </div>
        <div class="form-group">
          <label>App Version <span class="required" id="req-app-version" style="display: none;">*</span></label>
          <input type="text" id="version-app" placeholder="3.41.790" autocomplete="off">
        </div>
        <div class="form-group">
          <label>App Date</label>
          <input type="date" id="date-app">
        </div>
      </div>

      <!-- Hàng 2: Configurations và Link Detail nằm cạnh nhau -->
      <div class="form-row-single">
        <div class="form-group" style="flex: 1 1 300px;">
          <label>Configurations</label>
          <div class="pill-group">
            <div>
              <input type="checkbox" id="chk-webapp" class="pill-checkbox">
              <label for="chk-webapp" class="pill-label">Webapp</label>
            </div>
            <div>
              <input type="checkbox" id="chk-apptek" class="pill-checkbox">
              <label for="chk-apptek" class="pill-label">App</label>
            </div>
            <div>
              <input type="checkbox" id="chk-custom-note" class="pill-checkbox">
              <label for="chk-custom-note" class="pill-label">Custom Notes</label>
            </div>
          </div>
        </div>

        <div class="form-group" style="flex: 2 1 400px;">
          <label>Server / Link Detail</label>
          <input type="text" id="link-shared" placeholder="Internal server number (e.g., 8) or URL..."
            autocomplete="off">
        </div>
      </div>

      <div id="notes-wrapper" style="display: none; flex-direction: column;">
        <div id="notes-list"></div>
        <button type="button" id="btn-add-note" class="btn-text" style="align-self: flex-start; margin-top: 8px;">+ Add
          Note Line</button>
      </div>
    </section>

    <!-- Block 3: Scope of Testing -->
    <section class="card">
      <div class="card-title">
        <span>3. Scope of Testing <span class="required">*</span></span>
        <div style="display: flex; gap: 4px;">
          <button type="button" id="btn-all-scope" class="btn-text">Select All</button>
          <button type="button" id="btn-none-scope" class="btn-text">Clear</button>
        </div>
      </div>

      <div id="scope-checkboxes-container" class="pill-group"></div>

      <div style="display: flex; gap: 8px; margin-top: 8px; max-width: 420px;">
        <input type="text" id="new-scope-input" placeholder="Add custom scope..." autocomplete="off">
        <button id="btn-add-scope" type="button" class="btn btn-secondary btn-sm">Add Scope</button>
      </div>
    </section>

  </main>

  <div class="action-dock">
    <button id="btn-generate" class="btn btn-primary">✨ Generate Report</button>
    <button id="btn-copy-main" class="btn btn-secondary" disabled>📋 Copy Report</button>
    <button id="btn-preview" class="btn btn-secondary" disabled>👁 Preview</button>
  </div>

  <textarea id="output" style="display: none;"></textarea>

  <div id="preview-modal" class="modal">
    <div class="modal-box">
      <div class="modal-head">
        <h2>Report Preview</h2>
        <button id="btn-close-modal" class="btn-text"
          style="font-size: 20px; color: var(--text-muted);">&times;</button>
      </div>
      <div class="modal-body">
        <textarea id="preview-output" readonly></textarea>
      </div>
      <div class="modal-foot">
        <button id="btn-copy-modal" class="btn btn-primary">📋 Copy to Clipboard</button>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-box"></div>

  <script src="app.js"></script>
</body>

</html>
